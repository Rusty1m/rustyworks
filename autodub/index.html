<style>
  :root{
    color-scheme:light;
    --bg:#faf8f5; --fg:#1c1a17; --muted:#6b6560; --line:#e0dad2;
    --card:rgba(255,255,255,.70); --accent:#b4541f; --accent-soft:rgba(253,238,227,.82);
  }
  *{box-sizing:border-box}

  /* 背景の模様。四角と丸をぼかして散らす。
     文字は白いカードの上に乗るので、模様は面の隙間から覗く程度に留める。
     position:fixed なのでスクロールしても再描画されない。 */
  .bg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
  .bg i{position:absolute; display:block}
  .bg i:nth-child(1){left:-7%;  top:5%;   width:150px; height:150px;
                     background:rgba(180,84,31,.20); border-radius:16%; transform:rotate(15deg); filter:blur(15px)}
  .bg i:nth-child(2){right:-6%; top:17%;  width:200px; height:200px;
                     background:rgba(180,84,31,.17); border-radius:50%; filter:blur(20px)}
  .bg i:nth-child(3){left:4%;   top:44%;  width:96px;  height:96px;
                     background:rgba(122,88,58,.20); border-radius:50%; filter:blur(13px)}
  .bg i:nth-child(4){right:-4%; top:60%;  width:160px; height:160px;
                     background:rgba(180,84,31,.18); border-radius:15%; transform:rotate(-14deg); filter:blur(16px)}
  .bg i:nth-child(5){left:-8%;  bottom:9%; width:190px; height:190px;
                     background:rgba(150,110,70,.18); border-radius:50%; filter:blur(19px)}
  .bg i:nth-child(6){right:10%; bottom:-3%; width:120px; height:120px;
                     background:rgba(180,84,31,.17); border-radius:17%; transform:rotate(26deg); filter:blur(14px)}
  /* 内容は模様の上に。負の z-index は環境差があるので使わない */
  .wrap{position:relative; z-index:1}
  body{
    margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    line-height:1.75; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px; margin:0 auto}
  header{margin-bottom:24px}
  h1{font-size:1.5rem; margin:0 0 6px; letter-spacing:.02em}
  .sub{color:var(--muted); font-size:.85rem; margin:0}
  /* 本物の再現ではなく誇張だと最初に断る。期待をここで合わせておく */
  .aside{display:inline-block; opacity:.72; font-size:.95em}

  textarea{
    width:100%; min-height:110px; padding:21px 14px 14px; resize:vertical;
    background:var(--card); color:var(--fg);
    border:1px solid var(--line); border-radius:10px; font:inherit; line-height:1.7;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:-1px}

  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0}
  /* 文字数は数える対象（入力欄・結果枠）の右下に付ける。
     ボタン行に混ぜると狭い画面で折り返して迷子になっていた。 */
  .count{display:block; text-align:right; margin:3px 3px 0;
         color:var(--muted); font-size:.8rem; font-variant-numeric:tabular-nums}
  .count.over{color:var(--accent); font-weight:700}

  button{
    font:inherit; font-size:.85rem; padding:7px 13px; cursor:pointer;
    background:var(--card); color:var(--fg);
    border:1px solid var(--line); border-radius:999px;
    transition:border-color .12s, background .12s, color .12s;
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  /* アイコンボタン。意味は title と aria-label が持つ */
  button.icon{padding:7px 10px; line-height:0}
  button.icon svg{width:16px; height:16px; display:block}

  /* 角に浮かせるボタン。枠の外に半分出して、面の操作だと分かるようにする */
  .field{position:relative}
  .fab{position:absolute; top:-14px; z-index:2; background:var(--bg);
       box-shadow:0 1px 3px rgba(0,0,0,.07)}
  .fab.tl{left:-2px}
  .fab.tr{right:-2px; top:-12px; width:25px; height:25px; padding:0;
          border-radius:50%; font-size:.74rem; line-height:1; color:var(--muted)}
  .fab.tr[aria-expanded=true]{background:var(--accent); color:#fff; border-color:var(--accent)}
  button.round{width:34px; height:34px; padding:0; display:grid; place-items:center}
  .speak{margin-top:10px}
  .speakLabel{color:var(--muted); font-size:.8rem}

  /* 入力の区切りを明確にするため、モードの前を広く取る */
  .modes{display:flex; flex-wrap:wrap; gap:6px; margin:26px 0 4px}
  .modes button{padding:8px 14px}
  button[hidden]{ display:none; }
  .modes button[aria-pressed=true]{
    background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;
  }
  /* 画面が狭いときはモードを1行に畳んで横スクロール。
     3行に折り返すと結果が画面外へ押し出されるため。 */
  @media (max-width:560px){
    .modes{
      flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      /* 右端をぼかして、まだ続くことを示す */
      mask-image:linear-gradient(to right,#000 88%,transparent);
    }
    .modes::-webkit-scrollbar{display:none}
    .modes button{flex:0 0 auto}
  }
  .tip{color:var(--muted); font-size:.78rem; margin:10px 0 0; line-height:1.75}
  .tip b{color:var(--fg); font-weight:600}
  .modeNote{color:var(--muted); font-size:.78rem; margin:0 0 12px; min-height:1.4em}
  .hint{color:var(--muted); font-size:.78rem; margin:-4px 0 0; line-height:1.6}
  .hint b{color:var(--fg); font-weight:600}

  .out{
    padding:18px; min-height:130px;
    background:var(--accent-soft); border:1px solid var(--line);
    border-radius:10px; white-space:pre-wrap; word-break:break-word;
    font-size:1.05rem; line-height:2;
  }
  .out:empty::before{content:"ここに変換結果が出ます"; color:var(--muted); font-size:.9rem}

  h2{font-size:.8rem; color:var(--muted); font-weight:600;
     letter-spacing:.08em; margin:26px 0 8px; text-transform:uppercase}
  footer{margin-top:48px; padding-top:18px; border-top:1px solid var(--line);
         color:var(--muted); font-size:.8rem}
  footer a{color:var(--accent)}
  /* 版を出しておく。ブラウザに古いものが残っていても、ここを見れば分かる */
  .ver{float:right; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
       font-size:.72rem; opacity:.7; letter-spacing:.02em}

  /* ================= UI 仕上げ（配置は変えず、見え方だけ） ================= */

  /* 塗りの主役をひとつに。本文の投稿は輪郭だけにして段を落とす */
  #post{background:transparent; color:var(--accent); border-color:var(--accent)}
  #post:hover{background:var(--accent-soft)}

  /* クリア・引き直すは補助操作。主要ボタンと同じ重さで並べない */
  #clear, #reroll{color:var(--muted)}
  #clear:hover, #reroll:hover{color:var(--fg)}

  /* 結果が主役。入力欄より重く見えるよう縁と影を足す */
  .out{
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line));
    box-shadow:0 10px 26px -20px rgba(0,0,0,.55);
  }

  /* 補足文が詰まって読み飛ばされていたので行間を戻す */
  .hint{margin-top:2px; line-height:1.85}
  .modeNote{line-height:1.7}
</style>
</head>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">

<header>
  <h1>オートダビング構文</h1>
  <p class="sub">日本語を、YouTube の自動吹き替えっぽい日本語に変換します。<span class="aside">※少しオーバーに変換します</span></p>
</header>

<div class="field">
  <button id="clear" class="icon fab tl" title="入力を消す" aria-label="入力を消す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
  <button id="tipBtn" class="fab tr" aria-expanded="false" aria-controls="tip"
          title="括弧で囲んだ部分は変換されません" aria-label="使い方">?</button>
  <textarea id="in" maxlength="400" placeholder="ここに日本語を入力（例：今日の会議、3時間もあって死にそうだった。）"></textarea>
</div>
<p class="tip" id="tip" hidden>「かぎ括弧」『二重かぎ』（丸括弧）【すみ付き】"引用符" で囲んだ部分は
  <b>そのまま出ます</b>。作品名・固有名詞・引用を守るのに使ってください。</p>

<div class="row">
  <button id="post" class="primary">本文を 𝕏 に投稿</button>
  <span class="count" id="count">0 / 200</span>
</div>
<div class="modes" id="modes"></div>
<p class="modeNote" id="modeNote"></p>

<div class="field">
  <button id="reroll" class="icon fab tl" title="別の変換を引き直す" aria-label="別の変換を引き直す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7"/><path d="M13.4 2.4v3h-3"/></svg></button>
  <div class="out" id="out"></div>
</div>
<div class="row">
  <button id="postResult" class="primary">変換結果を 𝕏 に投稿</button>
  <button id="copy" class="icon" title="返信用にコピー" aria-label="返信用にコピー"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.8" y="5.8" width="7.7" height="7.7" rx="1.6"/><path d="M10.6 3.4H4a1.6 1.6 0 0 0-1.6 1.6v6.6"/></svg></button>
  <span class="count" id="fit" title="X に投稿できる長さ（全角換算）。超えた分は末尾が切り詰められます。">0 / 0</span>
</div>
<div class="row speak" id="speakRow" hidden>
  <span class="speakLabel">読み上げ</span>
  <button id="play" class="icon round" title="読み上げる" aria-label="読み上げる"></button>
</div>
<p class="hint">本文をそのまま投稿 → <b>その投稿への返信</b>に変換結果を貼ると、前後の対比が伝わります。</p>

<script>
"use strict";

/* ============================================================
   オートダビング構文 変換エンジン（純JS・依存なし）

   方針: 忠実な再現ではなく「風」。観測された現象を実測より濃く出す。
   要点: フィラーの振りかけだけでは足りない。文を組み替えること。
   ============================================================ */

/* ---------- 1. フィラー（実測の出現比率で重み付け） -------- */
const FILLERS      = [["ええと",57],["ええ",30],["えっと",13]];
const FILLERS_SUB  = [["ええと",40],["ええ",40],["まあ",20]];

/* ---------- 2. 定型文：完全一致で最高品質の訳を固定 -------- */
const PHRASES = [
  [/^チャンネル登録(を)?(よろしく|お願いします|してね|して)?[。!！]*$/,
   "もしあなたがこのビデオを楽しんだなら、親指を上げることを忘れないでください。そして購読ボタンを押してください。"],
  [/^(高|グッド)?評価(を)?(よろしく|お願いします)[。!！]*$/, "このビデオに親指を上げることを忘れないでください。"],
  [/^(それでは|では)?また(次回|ね|会いましょう)?[。!！]*$/, "えぇ、次のビデオでお会いしましょう。"],
  [/^(こんにちは|こんちは|やあ|どうも)[。!！]*$/, "えぇ、みなさん、こんにちは。"],
  [/^おはよう(ございます)?[。!！]*$/, "えぇ、みなさん、良い朝です。"],
  [/^こんばんは[。!！]*$/, "えぇ、みなさん、良い夜です。"],
  [/^はじめまして[。!！]*$/, "初めてあなたに会います。"],
  [/^お疲れ(様|さま)?(です|でした)?[。!！]*$/, "あなたの疲れた仕事に感謝します。"],
  [/^よろしくお願いします[。!！]*$/, "私はあなたの親切をあらかじめ感謝します。"],
  [/^お世話になっております[。!！]*$/, "私はあなたの継続的なサポートに感謝します。"],
  [/^ご確認(の程)?よろしくお願いします[。!！]*$/, "あなたはそれを確認することができますか。"],
  [/^承知(いたし|し)ました[。!！]*$/, "私はそれを理解しました。"],
  [/^かしこまりました[。!！]*$/, "私はあなたの願いを理解しました。"],
  [/^申し訳(ございません|ありません|ない)[。!！]*$/, "私は非常に申し訳なく思います。"],
  [/^すみません[。!！]*$/, "私を許してください。"],
  [/^ごめん(なさい|ね)?[。!！]*$/, "私は残念に思います。"],
  [/^ありがとう(ございます|ございました)?[。!！]*$/, "私はあなたにとても感謝しています。"],
  [/^どういたしまして[。!！]*$/, "それは何でもありません。"],
  [/^いただきます[。!！]*$/, "私はこの食べ物を受け取ります。"],
  [/^ごちそうさま(でした)?[。!！]*$/, "それはごちそうでした。"],
  [/^行ってきます[。!！]*$/, "私は行って、そして戻ってきます。"],
  [/^行ってらっしゃい[。!！]*$/, "行って、そして戻ってきてください。"],
  [/^ただいま[。!！]*$/, "えぇ、私は今、戻りました。"],
  [/^おかえり(なさい)?[。!！]*$/, "あなたは戻ってきました。"],
  [/^おやすみ(なさい)?[。!！]*$/, "良い夜を持ってください。"],
  [/^いらっしゃいませ[。!！]*$/, "ようこそ、私たちの店へ。"],
  [/^お大事に[。!！]*$/, "あなた自身の世話をしてください。"],
  [/^おめでとう(ございます)?[。!！]*$/, "私はあなたを祝福します。"],
  [/^頑張って[。!！]*$/, "あなたの足を折ってください。"],
  [/^乾杯[。!！]*$/, "私たちのグラスを上げましょう。"],
  [/^お邪魔します[。!！]*$/, "私はあなたを邪魔します。"],
  [/^失礼します[。!！]*$/, "私は失礼な行動をとります。"],
  [/^久しぶり(だね|ですね)?[。!！]*$/, "私たちは長い時間、会っていません。"],
  [/^まじで[。!？!？]*$/, "本当に。"],
  [/^やばい[。!！]*$/, "それはクレイジーです。"],
  [/^うける[。!！]*$/, "それは私を笑わせます。"],
  [/^神[。!！]*$/, "それは神です。"],
];

/* ---------- 2b. 短い口語：英語化すると必ず膨らむ ----------- */
/*    短文には構造変換ルールが当たらないので、丸ごと表引きする  */
const SHORT = {
  "疲れた":"えぇ、私は本当に疲れています。",
  "眠い":"私は眠気を感じています。",     "眠たい":"私は眠気を感じています。",
  "腹減った":"私は空腹を持っています。", "お腹すいた":"私は空腹を持っています。",
  "喉乾いた":"私は渇きを持っています。",
  "暑い":"それは本当に暑いです。",       "寒い":"それは本当に寒いです。",
  "痛い":"それは私を傷つけます。",       "怖い":"私は恐れを感じています。",
  "だるい":"それは私にとって困難です。", "しんどい":"それは私にとって困難です。",
  "つらい":"それは私にとって困難です。", "きつい":"それは私にとって困難です。",
  "面倒くさい":"それはあまりにも多くの努力を必要とします。",
  "めんどくさい":"それはあまりにも多くの努力を必要とします。",
  "帰りたい":"私は私の家に帰りたいです。","寝たい":"私は眠りにつきたいです。",
  "無理":"それは不可能です。",           "できない":"私はそれをすることができません。",
  "わからない":"私は知りません。",       "分からない":"私は知りません。",
  "知らない":"私はそれについての知識を持っていません。",
  "暇":"私は自由な時間を持っています。", "忙しい":"私は忙しいです。",
  "つまらない":"それは退屈です。",       "うるさい":"それはあまりにも大きな音です。",
  "楽しい":"それは楽しいです。",         "嬉しい":"私はとても幸せです。",
  "悲しい":"私は悲しいです。",           "寂しい":"私は孤独を感じています。",
  "好き":"私はそれが好きです。",         "嫌い":"私はそれが好きではありません。",
  "うまい":"それは本当に美味しいです。", "おいしい":"それは本当に美味しいです。",
  "まずい":"それは良い味がしません。",   "すごい":"それは驚くべきことです。",
  "最高":"それは最高です。",             "最悪":"それは最悪です。",
  "ありえない":"それは起こり得ません。", "びっくりした":"私は驚かされました。",
  "助かった":"私は救われました。",       "よかった":"それは良いことでした。",
  "だめ":"それは良くありません。",       "やめて":"それをやめてください、いいですか？",
  "待って":"待ってください、いいですか？","違う":"それは正しくありません。",
};
// 「疲れたー」「疲れた！」「疲れたわ」なども拾えるようにする
const SHORT_RULES = Object.entries(SHORT)
  .sort((a,b)=>b[0].length-a[0].length)
  .map(([k,v])=>[new RegExp("^"+k+"[ぁ-んー]{0,2}[。、！？!?…～~\\s]*$"), v]);

/* ---------- 3. 述語パターン：語ではなく文型を作り替える ----- */
/*    ここが「振りかけ」と「組み替え」の差。効果が最も大きい    */
const PREDICATES = [
  [/死にそうだった/g, "死ぬところでした"],
  [/死にそう/g, "死ぬところ"],
  [/そうになった/g, "するところでした"],
  [/しちゃった|しちゃっ た/g, "してしまいました"],
  // 「めっちゃうまい」を「めってしまいますまい」に壊すため文末限定にする
  [/ちゃった([。、！？]|$)/g, "てしまいました$1"],
  [/ちゃう([。、！？]|$)/g, "てしまいます$1"],
  [/すぎる/g, "あまりにも多い"],
  [/すぎた/g, "あまりにも多かったです"],
  [/たことがある/g, "した経験を持っています"],
  [/たことない/g, "した経験を持っていません"],
  [/しかない/g, "する以外に選択肢はありません"],
  [/わけがない|はずがない/g, "方法はありません"],
  [/かもしれない/g, "かもしれません"],
  [/に違いない/g, "に違いありません"],
  [/なければならない|ないといけない|なきゃ/g, "しなければなりません"],
  [/した方がいい|したほうがいい/g, "するべきです"],
  [/するべき|すべき/g, "するべき"],
  [/できる/g, "することができます"],
  [/できた/g, "することができました"],
  [/できない/g, "することができません"],
  [/と思う/g, "だと私は思います"],
  [/と思った/g, "だと私は思いました"],
  [/気がする/g, "という感じを持っています"],
  [/ような気がした/g, "のように感じました"],

/* ---------- 変換しない範囲（引用・括弧） ----------
   固有名詞・作品名・引用は壊れると困る。囲まれた部分は退避しておき、
   全ての変換が終わってから元に戻す。
   退避先の記号には私用領域（U+E000〜）を使う。日本語の文字クラスにも
   数字にも該当しないので、どの変換ルールにも巻き込まれない。          */
const QUOTED = /「[^」]*」|『[^』]*』|（[^）]*）|【[^】]*】|\([^)]*\)|"[^"]*"|“[^”]*”/g;
const MASK0 = 0xE000, MASK_MAX = 200;

function mask(text){
  const kept = [];
  const masked = text.replace(QUOTED, m => {
    if(kept.length >= MASK_MAX) return m;          // 異常に多いときは諦めて通す
    kept.push(m);
    return String.fromCharCode(MASK0 + kept.length - 1);
  });
  return [masked, kept];
}
const unmask = (s, kept) => kept.length
  ? s.replace(/[\uE000-\uE0C7]/g, c => kept[c.charCodeAt(0) - MASK0] ?? c)
  : s;

/* ---------- ユーティリティ ---------- */
function pick(weighted){                       // [[値,重み],...]
  const total = weighted.reduce((s,[,w])=>s+w, 0);
  let r = Math.random()*total;
  for(const [v,w] of weighted){ if((r-=w) < 0) return v; }
  return weighted[weighted.length-1][0];
}
const pickFlat = a => a[Math.floor(Math.random()*a.length)];   // 素の配列用
const chance = p => Math.random() < p;

/* ---------- 変換ステップ ---------- */

// 終助詞を落とす（あの平板さの源）
function dropParticles(s){
  return s
    .replace(/(だ|です|ます|でした|ました)(ね|よ|な|わ|ぞ|ぜ|さ)+([。、！？]|$)/g,"$1$3")
    .replace(/(ね|よ|な|わ|ぞ|ぜ)+([。！？]|$)/g,"$2");
}

/* ★★ 構造変換。ここが本体。
   日本語の口語は「体言止め・助詞省略・読点による句の羅列」でできている。
   英語は主語と述語を省略できないので、そこを崩さないと何も変わらない。   */
function restructure(s, rate){
  const on = () => chance(rate);
  const before = s;

  // 1) 文頭「Aの B、」→「A、B は」   今日の会議、→ 今日、会議は
  //    「静かなので、」の「の」を所有格と誤認しないよう ので/のに/のは を除外
  s = s.replace(/(^|[。\n])([^、。]{1,8})の(?![でにはがもを])([^、。]{2,10})、/g,
                (m,p,a,b)=> on() ? `${p}${a}、${b}は` : m);

  // 2) 文頭の名詞＋読点 →「〜は、」  1) が効いた文には二重にかけない
  if(s === before){
    s = s.replace(/(^|[。\n])([一-龠ァ-ヶー]{2,12})、/g,
                  (m,p,a)=> on() ? `${p}${a}は、` : m);
  }

  return s
    // 3) 省略された助詞を補う（英語は省略できない）
    //    「今」は「今日」に食い込んで「今は日」を作るので入れない
    .replace(/(^|[。、\n])(これ|それ|あれ|ここ|そこ|今日|明日|昨日)([^はがをにでもとのへや、。])/g,
             (m,p,a,b)=> on() ? `${p}${a}は${b}` : m)
    // 4) 数量＋も →「なんと〜です。」と切り出して誇張する
    .replace(/([0-9０-９]+[^、。]{0,4})も(あって|かかって|あった|かかった|して)/g,
             (m,a)=> on() ? `なんと${a}です。そして、` : m)
    // 5) 「Aが B で、」→「A は B です。そして、」
    .replace(/([^、。]{1,12})が([^、。]{1,8})で、/g,
             (m,a,b)=> on() ? `${a}は${b}です。そして、` : m)
    /* 6) 接続助詞で切る（英語の短文＋接続詞の連鎖感）
          「ので/けど/から」の前は連体形なので動詞とは限らない。
          機械的に「ます」を足すと「同じなます」「暑くました」に壊れる。
          語尾の種類ごとに分ける。                                   */
    // 丁寧形＋が →「です。しかし、」   思いますが、→ 思います。しかし、
    .replace(/(ます|です)が、/g,          (m,a)=> on() ? a+"。しかし、"     : m)
    // 普通形＋が →「。しかし、」  しているが、→ している。しかし、
    //   主語の「が」と紛れないよう、直前が述語で終わる字のときだけ切る
    .replace(/([^、。]{2,}[るただい])が、/g,(m,a)=> on() ? a+"。しかし、"     : m)
    // 名詞＋な / 形容詞い の前は「です」で受ける
    .replace(/([^、。]{2,})な(ので|のに)、/g,(m,a)=> on() ? a+"です。だから、" : m)
    .replace(/([^、。]{1,}い)(ので|から)、/g,(m,a)=> on() ? a+"です。だから、" : m)
    .replace(/([^、。]{2,})なけど、/g,     (m,a)=> on() ? a+"です。しかし、"  : m)
    .replace(/([^、。]{1,}い)けど、/g,     (m,a)=> on() ? a+"です。しかし、"  : m)
    // 過去形の前は切るだけでよい（politen が「ました」にする）
    .replace(/([^、。]{2,}[ただ])(ので|から)、/g,(m,a)=> on() ? a+"。だから、"  : m)
    .replace(/([^、。]{2,}[ただ])けど、/g, (m,a)=> on() ? a+"。しかし、"      : m)
    // 形容詞の連用「〜くて、」は「いです」で受ける
    .replace(/([^、。]{2,})くて、/g,       (m,a)=> on() ? a+"いです。そして、" : m)
    // 動詞の連用中止（「暑くて」を除くため直前が「く」でないもの）
    .replace(/([^、。]{3,}[^く])て、/g,    (m,a)=> on() ? a+"ました。そして、" : m)
    // 「〜し、」は敬体化の前に切る（後だと「疲れましたし、」を壊す）
    //  直前が「か」のものを除外。上のルールが作った「しかし、」を食べてしまうため
    .replace(/([^、。]{2,}[^か])し、/g,(m,a)=> on() ? a+"。そして、"    : m)
    // ★ 後始末。上のルールは「〜です。そして、」の形で文を割るので、
    //    元の文が そこで終わっていると接続詞だけが宙に浮き、
    //    後段が「そして、です。」という中身の無い文を作ってしまう。
    //    どのルールにも効くよう、最後にまとめて落とす。
    //    元の文が続いていても「〜です。そして、。」の形で句点に突き当たる。
    //    末尾だけを見ていたので、この型を取り逃がしていた。
    .replace(/(?:そして|しかし|つまり|それで)、\s*(?=[。！？\n]|$)/g, "")
    //    接続詞を抜いた跡に句点が二つ残る。空の文になって主語だけ補われる
    .replace(/。[。、]+/g, "。");
}

/* ★ 体言止めを存在文にする。「水の音。」→「そこに水の音があります。」
   俳句のような名詞終わりの文が一切変換されない問題への対処。          */
function existify(s){
  const core = s.replace(/[。！？\s]+$/,"");
  if(!core) return s;
  // すでに丁寧な述語で終わっていれば何もしない
  if(/(です|ます|ました|でした|ません|でしょう|ください|ますか|たい)$/.test(core)) return s;
  // 漢字・カタカナ終わり＝典型的な体言止め → 存在文にする
  if(/[一-龠ァ-ヶー]$/.test(core)) return "そこに" + core + "があります。";
  // 活用語で終わっていなければ（「明日は休み。」など）断定を補う
  if(/([うくすつぬふむゆるぐずぶぷ]|[たっいなだ])$/.test(core)) return s;
  return core + "です。";
}

// 「〜がある/いる」を have の直訳に
function haveify(s){
  return s
    .replace(/([^、。]{1,14})が(ある|あります)([。、])/g,"私は$1を持っています$3")
    .replace(/([^、。]{1,14})が(いる|います)([。、])/g,"私は$1を持っています$3")
    // 「時間がない」「記憶がない」= 存在の否定。have の否定形に寄せる
    .replace(/([^、。]{1,14})が(ない|ありません)([。、！？]|$)/g,"私は$1を持っていません$3")
    .replace(/([^、。]{1,14})を持ってる/g,"$1を持っています");
}

/* ★ 冠詞・指示詞を補う。日本語に無いものを足すので効果が大きい。
   the pen → そのペン / a pen → 一つのペン / this → この                */
function determinize(s, rate){
  // 直前が漢字・カタカナだとマッチが語の途中から始まる（レ「一つの」ストラン）。
  // 「の」の直後は既に修飾済みなので除く（私の友達 → 私のその友達 を防ぐ）。
  return s.replace(/(?<![0-9０-９一-龠ァ-ヶーの])([一-龠ァ-ヶー]{1,7})(を|が|は|に|で|へ|も)/g,
                   (m, n, p, off, str) => {
    if(NO_DET.has(n)) return m;                        // 人称・時の語には付けない
    if(NO_DET_PHRASE.some(w => str.startsWith(w, off))) return m;   // 複合動詞
    if(!chance(rate)) return m;
    return pick(DETERMINERS) + n + p;
  });
}

// 所有格と一人称を明示する
function pronounify(s, me="私"){
  s = s.replace(/僕|俺|自分|わたし|あたし|私/g, me);
  for(const w of POSSESS){
    // 「お父さん」を「お私の父さん」に壊さないため お の直後は除外
    s = s.replace(new RegExp("(?<!"+me+"の)(?<!あなたの)(?<!お)"+w,"g"), me+"の"+w);
  }
  return s;
}

// た形の表引きは長いキーから。かつ「でした」「ました」を壊さないよう
// 直前が ま / で のときは対象外にする（"した"→"しました" が暴発するため）
const PAST_RULES = Object.entries(PAST)
  .sort((a,b)=>b[0].length-a[0].length)
  .map(([k,v])=>[new RegExp("(?<![まで])"+k,"g"), v]);

// 敬体に寄せる
function politen(s){
  for(const [re,v] of PAST_RULES) s = s.replace(re, v);
  return s
    .replace(/られた([。、！？]|$)/g,"られました$1")
    .replace(/れた([。、！？]|$)/g,"れました$1")
    .replace(/([いっ])てた([。、！？]|$)/g,"$1ていました$2")
    .replace(/([いっ])てる([。、！？]|$)/g,"$1ています$2")
    .replace(/んでる([。、！？]|$)/g,"んでいます$1")
    // 「している」「読んでいる」。既存の「てる」型では拾えず、常体のまま残っていた
    .replace(/([てで])いる([。、！？]|$)/g,"$1います$2")
    .replace(new RegExp("("+ADJ+")かった","g"),"$1かったです")
    .replace(/くない([。！？]|$)/g,"くないです$1")
    .replace(new RegExp("("+ADJ+")い([。！？]|$)","g"),"$1いです$2")
    .replace(/(^|[、。])いい([。！？]|$)/g,"$1いいです$2")
    // ナ形容詞の終止（「犬が好き。」が敬体化されない穴）
    .replace(/(好き|嫌い|元気|大事|大切|必要|便利|不便|静か|綺麗|きれい|有名|得意|苦手|残念|大丈夫|無理|自由|変|楽)([。！？]|$)/g,"$1です$2")
    .replace(/だった/g,"でした")
    .replace(/じゃない/g,"ではありません")
    .replace(/だろう?([。！？]|$)/g,"でしょう$1")
    .replace(/でしょ([。！？]|$)/g,"でしょう$1")
    // 否定の過去（五段は語尾が規則的に変わる）
    .replace(/わなかった/g,"いませんでした").replace(/かなかった/g,"きませんでした")
    .replace(/がなかった/g,"ぎませんでした").replace(/さなかった/g,"しませんでした")
    .replace(/たなかった/g,"ちませんでした").replace(/ばなかった/g,"びませんでした")
    .replace(/まなかった/g,"みませんでした").replace(/らなかった/g,"りませんでした")
    .replace(/なかった/g,"ませんでした")
    // 説明の「〜んだ」→「〜んです」。「読んだ」（動詞の過去）と区別するため、
    // 「ん」の直前がひらがな（あるんだ／行くんだ／痛いんだ）のときだけ変換する
    .replace(/(?<=[ぁ-ん])んだ([。！？]|$)/g,"んです$1")
    // 「急いだ」「読んだ」は動詞の過去。断定の「だ」と間違えない
    .replace(/(?<![んい])だ([。！？]|$)/g,"です$1")
    .replace(/かない([。！？]|$)/g,"きません$1")
    // 「がない」は五段活用より「〜が無い」の方が圧倒的に多いので haveify に任せる
    .replace(/さない([。！？]|$)/g,"しません$1")
    .replace(/たない([。！？]|$)/g,"ちません$1")
    .replace(/ばない([。！？]|$)/g,"びません$1")
    .replace(/まない([。！？]|$)/g,"みません$1")
    .replace(/らない([。！？]|$)/g,"りません$1")
    .replace(/わない([。！？]|$)/g,"いません$1")
    .replace(/ない([。！？]|$)/g,"ません$1")
    .replace(/([^ま])する([。、！？]|$)/g,"$1します$2")
    .replace(/たい([。！？]|$)/g,"たいです$1")
    .replace(/ないで([。！？]|$)/g,"ないでください$1")
    .replace(/ありがとう([。！？]|$)/g,"ありがとうございます$1");
}

/* 普通形の動詞が終止に残ると、敬体のはずの文に「歩く。」が混ざる。
   ただし五段と一段は表記から見分けられない（走る／見る）ので、機械的に
   活用させると「走ます」に壊れる。活用は諦めて「〜のです」で受ける。
   もったいぶった言い回しは、この構文の持ち味でもある。            */
const POLITE_TAIL = /(ます|です|ました|でした|ません|でしょう|ください|ございます)$/;
//   「帰った」のように た形の表に無い動詞も、敬体の文に常体のまま残る。
//   活用させずに同じ手で受ける（帰った → 帰ったのです）。
const PLAIN_END = /^(.*[^。、！？\n])([うくぐすつぬぶむるた])([。！？]?)$/;
// 動詞と同じ字で終わるが動詞ではないもの。形容詞の連用（早く）と助数詞（一つ）
const NOT_VERB = new RegExp("(("+ADJ+")く|[0-9０-９一二三四五六七八九十いく幾]つ|そう|もう|どう|こう)$");
function wrapPlain(s){
  const m = s.match(PLAIN_END);
  if(!m) return s;
  const clause = m[1] + m[2];
  if(POLITE_TAIL.test(clause)) return s;              // 既に敬体なら触らない
  if(NOT_VERB.test(clause))    return s;              // 「早く」「一つ」は動詞ではない
  return clause + pickFlat(["のです","んです"]) + (m[3] || "。");
}

// ★ 冗長化。解説動画モードの本体
// 語幹を食べてしまうので「ました」の丸ごと置換はしない（付け足すだけ）
function redundify(s, rate){
  if(!chance(rate)) return s;
  return s
    // 「行くんです」→「行くんということです」に壊れるので「ん」の後では止める
    .replace(/(?<![んの])です([。！？]|$)/,"ということです$1")
    .replace(/(?<!ん)ます([。！？]|$)/,"ますということです$1");  // 置換ではなく付け足す
}

/* ★ 短文を膨らませる。
   英語は主語・目的語・時制を省略できないので、短い日本語ほど戻すと長くなる。
   構造変換ルール（読点や節が前提）は短文に当たらないので、ここで補う。 */
function padShort(s){
  const hasObj = /[をにへ]/.test(s);
  if(!hasObj){
    if(/(行き|帰り|来|入り|出|着き)(ました|ます)/.test(s))
      s = s.replace(/(行き|帰り|来|入り|出|着き)(ました|ます)/, "そこへ$1$2");
    // 「し」は入れない。「勉強しました」→「勉強それをしました」に壊れる
    else if(/(食べ|飲み|見|買い|読み|使い|作り|やり|書き|聞き)(ました|ます)/.test(s))
      s = s.replace(/(食べ|飲み|見|買い|読み|使い|作り|やり|書き|聞き)(ました|ます)/, "それを$1$2");
  }
  // 英語は強調副詞を多用する
  if(chance(.6)) s = s.replace(/^(私は|あなたは|それは)(?![^、。]{0,4}本当に)/, "$1本当に");
  return s;
}

/* ★ 常体に戻す。実測では吹き替えの終助詞は常体に付いていた
     （…てるわ／…あるのよ／…したわ）。敬体化の結果を逆変換する。      */
const PLAIN_PAST = Object.entries(PAST)
  .sort((a,b)=>b[1].length-a[1].length)
  .map(([plain,polite])=>[new RegExp(polite,"g"), plain]);

function plainify(s){
  for(const [re,v] of PLAIN_PAST) s = s.replace(re, v);   // 行きました → 行った
  return s
    .replace(/ています/g,"てる").replace(/でいます/g,"でる")
    .replace(/ではありません/g,"じゃない")
    .replace(/がありません/g,"がない").replace(/ありません/g,"ない")
    .replace(/があります/g,"がある").replace(/あります/g,"ある")
    .replace(/できません/g,"できない").replace(/できます/g,"できる")
    .replace(/ますということです/g,"ということだ").replace(/ということです/g,"ということだ")
    // 否定（五段は語尾が戻る）
    .replace(/きませんでした/g,"かなかった").replace(/ぎませんでした/g,"がなかった")
    .replace(/しませんでした/g,"さなかった").replace(/ちませんでした/g,"たなかった")
    .replace(/びませんでした/g,"ばなかった").replace(/みませんでした/g,"まなかった")
    .replace(/りませんでした/g,"らなかった").replace(/いませんでした/g,"わなかった")
    .replace(/ませんでした/g,"なかった")
    .replace(/きません/g,"かない").replace(/ぎません/g,"がない")
    .replace(/しません/g,"さない").replace(/ちません/g,"たない")
    .replace(/びません/g,"ばない").replace(/みません/g,"まない")
    .replace(/りません/g,"らない").replace(/いません/g,"わない")
    .replace(/ません/g,"ない")
    // 形容詞＋です は「です」を落とすだけ（暑いです → 暑い）
    .replace(new RegExp("("+ADJ+")いです","g"),"$1い")
    .replace(/たいです/g,"たい").replace(/くないです/g,"くない")
    .replace(/でしょう/g,"だろう").replace(/でした/g,"だった").replace(/です/g,"だ")
    // 非過去（五段）
    .replace(/します/g,"する")
    .replace(/きます/g,"く").replace(/ぎます/g,"ぐ").replace(/ちます/g,"つ")
    .replace(/びます/g,"ぶ").replace(/みます/g,"む").replace(/ります/g,"る")
    .replace(/います/g,"う").replace(/ます/g,"る");
}

/* ★ 終助詞。実測では吹き替えの最大の特徴。
   英語は文末に話者の性別が出ないのに、日本語の吹き替えは付ける。
   丁寧形の末尾に足すだけなので語幹を壊さない。                    */

// 常体の文末に終助詞を足す。付く先は 常体（〜た / 〜る / 〜ない / 〜だ）。
function tailize(s, rate, tails){
  if(!tails || !chance(rate)) return s;
  const t = pick(tails);
  return s.replace(/(んだ|だ|た|る|う|い|ない|かった|なかった)([。！]|$)/, (m, a, p) => {
    p = p || "。";
    // 男ことばは形容詞の言い切りに直接付かない（「強いぜ」は不自然）
    if(tails === MALE_TAIL && /^(い|かった)$/.test(a)) return m;
    if(DA_NA.has(t))   return (a === "んだ" ? "" : a === "だ" ? "な" : a) + t + p;
    if(DA_DROP.has(t)) return (a === "んだ" ? "の" : a === "だ" ? "" : a) + t + p;
    return a + t + p;                      // だわ / だぜ / だぞ / だな はそのまま
  });
}

// 文頭に主語を補う（雑でよい。雑さが芸風と噛み合う）
let ME='私';
function addSubject(s, p=.55){
  if(/^(私|あなた|それ|これ|そこ|なんと|そして|しかし|だから|つまり|ああ|おっと|待って|よし)/.test(s)) return s;
  if(/^私|私は/.test(s)) return s;
  // すでに主題（は）や主格（が）がある文に「私は」を足すと二重主語になる
  if(/[はが]/.test(s.replace(/^[ぁ-ん]{0,3}、/,""))) return s;
  if(/[？?]$/.test(s)) return chance(.7) ? "あなたは"+s : s;
  return chance(p) ? (ME||"私")+"は"+s : s;
}

/* ---------- メイン ---------- */
/* ---- 空振りの受け皿 ----
   カタカナや専門語が多い文は辞書に当たらず、構造変換のルールも噛まないと
   語尾が変わるだけで終わる。似すぎていたら引き直し、それでも駄目なら
   フィラーだけは必ず入れて、何も起きていない状態を避ける。 */
function lcsLen(a, b){                     // 最長共通部分列の長さ
  let prev = new Uint16Array(b.length + 1), cur = new Uint16Array(b.length + 1);
  for(let i = 1; i <= a.length; i++){
    for(let j = 1; j <= b.length; j++)
      cur[j] = a[i-1] === b[j-1] ? prev[j-1] + 1 : Math.max(prev[j], cur[j-1]);
    [prev, cur] = [cur, prev]; cur.fill(0);
  }
  return prev[b.length];
}
function tooSimilar(src, out){
  const strip = t => t.replace(/[。、！？!?\s]/g, "");
  const a = strip(src), b = strip(out);
  if(!a || !b) return false;
  return 2 * lcsLen(a, b) / (a.length + b.length) > .88;
}
function forceFiller(out, M){
  if(!M.fillerHead) return out;            // フィラーを使わないモードもある
  const lines = out.split("\n");
  const i = lines.findIndex(l => l && l !== M.open);   // 定型の挨拶行は避ける
  if(i < 0) return out;
  lines[i] = pick(FILLERS) + "、" + lines[i];
  return lines.join("\n");
}

function convert(text, modeKey){
  const M0 = MODES[modeKey] || MODES.standard;
  let out = convertOnce(text, modeKey);
  for(let i = 0; i < 3 && tooSimilar(text, out); i++) out = convertOnce(text, modeKey);
  return tooSimilar(text, out) ? forceFiller(out, M0) : out;
}

function convertOnce(text, modeKey){
  const M = MODES[modeKey] || MODES.standard;
  if(!text.trim()) return "";

  // 引用・括弧の中身を退避してから変換する（最後に戻す）
  const [src, kept] = mask(text);

  const whole = src.trim();
  for(const [re,rep] of PHRASES){ if(re.test(whole)) return unmask(rep, kept); }

  // 構造を崩してから文に分割する（順序が重要）
  const sents = restructure(src.replace(/\r/g,""), M.split)
    .split(/(?<=[。！？!?\n])/).map(s=>s.trim()).filter(Boolean);

  ME = M.me || '私';
  /* フィラーは均等に散らばらず固まって出る。実測では、相槌がまばらな
     区間は毎分0.1回なのに、応酬になる区間だけ毎分6.9回まで跳ねた。

     2状態で扱う。固まりの平均長を L とすると継続確率は 1-1/L、
     開始確率を p/(L(1-p)) に取れば、全体の出現率は元の p のまま保たれる。
     係数を掛ける形だと fillerHead の高いモードで上限に張り付き、
     一度始まると終わらなくなる（実際そうなった）。            */
  const RUN = 2.5;                                   // 固まりの平均の長さ（文）
  const fhBegin = Math.min(1, M.fillerHead / (RUN * (1 - M.fillerHead) || 1));
  let ran = false;
  const body = sents.map((raw,i)=>{
    let s = raw;
    const bare = s.replace(/\n/g,"");
    // 表引きで確定した文も、一人称・常体化・終助詞はモードに従わせる
    const finish = t => {
      t = pronounify(t, M.me || "私");
      if(!M.polite) t = plainify(t);
      return tailize(t, M.tailRate, M.tail);
    };
    for(const [re,rep] of PHRASES){    if(re.test(bare)) return finish(rep); }
    for(const [re,rep] of SHORT_RULES){ if(re.test(bare)) return finish(rep); }

    // 退避記号は1文字なので、長さは元の文字列に戻してから測る
    const short = unmask(bare, kept).replace(/[。、！？!?\s]/g,"").length <= 12;
    s = dropParticles(s);
    for(const [re,rep] of PREDICATES) s = s.replace(re,rep);
    for(const [re,rep] of IDIOMS)     s = s.replace(re,rep);
    for(const [re,rep] of WORDS)      s = s.replace(re,rep);
    s = haveify(s);
    s = pronounify(s, M.me || "私");
    s = determinize(s, M.det);
    s = politen(s);                  // まず敬体に正規化（活用の判定が一箇所で済む）
    s = wrapPlain(s);                // 活用できない普通形は「〜のです」で受ける
    s = existify(s);                 // 体言止め →「そこに〜があります」
    s = addSubject(s, short ? .85 : .55);
    // 短文は構造変換が当たらないので、補完と冗長化を強めにかける
    if(short){ s = padShort(s); s = redundify(s, Math.max(M.redundant, .55)); }
    else     { s = redundify(s, M.redundant); }
    if(!M.polite) s = plainify(s);   // 実測どおり常体へ戻す
    s = tailize(s, M.tailRate, M.tail);

    s = s.replace(/、/g, m => chance(M.fillerMid) ? "、"+pick(FILLERS_SUB)+"、" : m);

    let head = "";
    if(chance(ran ? 1 - 1/RUN : fhBegin)){
      head = pick(FILLERS)+"、";
      if(chance(M.double)) head = pick(FILLERS)+"、"+head;   // 連続がいちばんおかしい
      ran = true;
    } else ran = false;
    // 構造変換がすでに接続詞を置いた文には重ねない（「では、そして、」を防ぐ）
    if(i>0 && chance(.35) && !/^(そして|しかし|だから|つまり)/.test(s)) head += pickFlat(M.discourse);

    if(/ください[。！]?$/.test(s) && chance(.5)) s = s.replace(/[。！]?$/,"、いいですか？");
    if(!/[。！？!?\n]$/.test(s)) s += "。";
    return head+s;
  }).join("");

  return unmask([M.open, body, M.close].filter(Boolean).join("\n"), kept);
}

/* ---------- X（旧Twitter）への共有 ---------- */

const HASHTAG = "#オートダビング構文";

// X は全角（CJK）を2文字として数える。URL は実際の長さに関係なく常に23。
const CJK = /[ᄀ-ᇿ⺀-꓏ꥠ-꥿가-퟿豈-﫿︐-︟︰-﹏＀-｠￠-￦]/;
const xLen = s => [...s].reduce((n,c) => n + (CJK.test(c) ? 2 : 1), 0);

// 重み付きの上限に収まるよう末尾を落とす
function clip(s, budget){
  if(xLen(s) <= budget) return s;
  let out = "", n = 0;
  for(const c of s){
    const w = CJK.test(c) ? 2 : 1;
    if(n + w > budget - 1) break;        // 「…」の分を残す
    out += c; n += w;
  }
  return out + "…";
}

/* 前後を1投稿に詰めると、日本語では 140字相当しか入らず必ず溢れる。
   本文を投稿し、その返信に変換結果を貼る流れにすれば、
   対比はスレッドの構造が作ってくれるので、片方だけ収まればよい。 */
/* URL は付けない。付けると X が大きなカードを出して、書いた本人のネタが
   その下に埋もれる。宣伝の投稿にも見える。加えて X は外部リンク付きの
   投稿を伸ばしにくいので、拡散のたびにブレーキがかかる。
   リンクを持つのは告知の1本だけでよく、あとはハッシュタグが入口になる。 */
function buildReply(out){
  const fixed = `\n\n${HASHTAG}`;
  return `${clip(out.trim().replace(/\n+/g," "), 280 - xLen(fixed))}${fixed}`;
}

// 本文はユーザー自身の言葉。ハッシュタグもURLも足さずそのまま渡す。
const buildPost = src => src.trim();

/* ---------- プリセット ---------- */
const PRESETS = [
  ["日常","今日の会議、3時間もあって死にそうだった。めっちゃ疲れたし、もう帰りたい。"],
  ["飲食レポ","近所のラーメン屋に行ってきた。スープが濃厚でめっちゃうまいので、また来ようと思う。"],
  ["ゲーム実況","うわやられた。これ無理ゲーだろ。もう一回やってみるけど、たぶん勝てない。"],
  ["親への手紙","お父さん、いつもありがとう。あんまり無理しないでね。今度実家に帰るよ。"],
  ["退職の挨拶","短い間でしたが、お世話になりました。皆さんのおかげで成長できたと思います。"],
  ["ビジネス","お世話になっております。標記の件、ご確認いただけますでしょうか。"],
  ["告白","ずっと好きでした。結婚してください。"],
  ["怒り","ふざけんな。二度と来るか。"],
];

/* ---------- UI ---------- */
const $in=document.getElementById("in"), $out=document.getElementById("out"),
      $count=document.getElementById("count"), $modes=document.getElementById("modes"),
      $note=document.getElementById("modeNote");
const LIMIT=200;
let mode="standard";

const $fit = document.getElementById("fit");

function render(){
  const v=$in.value;
  $count.textContent=`${v.length} / ${LIMIT}`;
  $count.classList.toggle("over", v.length>LIMIT);
  $note.textContent=MODES[mode].note;
  $out.textContent=convert(v.slice(0,LIMIT), mode);

  // X は全角を2文字と数える＝日本語は実質140字。本文と同じ形で残量を出す
  const room = Math.floor((280 - xLen(`\n\n${HASHTAG}`)) / 2);
  const used = Math.ceil(xLen($out.textContent.trim().replace(/\n+/g," ")) / 2);
  $fit.textContent = `${$out.textContent ? used : 0} / ${room}`;
  $fit.classList.toggle("over", used > room);
}

for(const [key,m] of Object.entries(MODES)){
  const b=document.createElement("button");
  b.textContent=m.label; b.setAttribute("aria-pressed", key===mode);
  b.onclick=()=>{
    mode=key;
    [...$modes.children].forEach(x=>x.setAttribute("aria-pressed", x===b));
    if(TTS) stopSpeak();
    render();
  };
  $modes.appendChild(b);
}

$in.addEventListener("input", render);
document.getElementById("clear").onclick=()=>{ $in.value=""; $in.focus(); render(); };
document.getElementById("reroll").onclick=render;   // 確率的なので引き直せる
// 返信に貼る用。変換結果＋ハッシュタグ＋URL。
// アイコンボタンなので textContent を書き換えると中の SVG ごと消える。
// 差し替えるのは innerHTML にし、控えは読み込み時に取っておく（連打しても戻せる）。
const $copy = document.getElementById("copy");
const COPY_ICON = $copy.innerHTML, COPY_LABEL = $copy.title;
const ICON_DONE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.8"/></svg>';
let copyTimer = 0;
$copy.onclick = async () => {
  if(!$out.textContent) return;
  let ok = true;
  try { await navigator.clipboard.writeText(buildReply($out.textContent)); }
  catch { ok = false; }                 // 権限が無いと無反応のボタンに見えてしまう
  if(ok) $copy.innerHTML = ICON_DONE;
  const msg = ok ? "コピーしました" : "コピーできませんでした";
  $copy.title = msg;
  $copy.setAttribute("aria-label", msg);
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => {
    $copy.innerHTML = COPY_ICON;
    $copy.title = COPY_LABEL;
    $copy.setAttribute("aria-label", COPY_LABEL);
  }, 1600);
};

// 変換結果だけを投稿する（本文を出したくない場合の入口）
document.getElementById("postResult").onclick=()=>{
  if(!$out.textContent) return;
  window.open("https://x.com/intent/post?text=" + encodeURIComponent(buildReply($out.textContent)),
              "_blank", "noopener,noreferrer");
};

// 投稿はしない。X の作成画面を開くだけで、送信は本人が行う。
document.getElementById("post").onclick=()=>{
  const src = buildPost($in.value.slice(0,LIMIT));
  if(!src) return;
  window.open("https://x.com/intent/post?text=" + encodeURIComponent(src),
              "_blank", "noopener,noreferrer");
};

// 括弧の説明は畳んでおく。初見で読ませたいのは入力欄そのもの
const $tipBtn = document.getElementById("tipBtn"), $tip = document.getElementById("tip");
$tipBtn.onclick = () => {
  $tip.hidden = !$tip.hidden;
  $tipBtn.setAttribute("aria-expanded", String(!$tip.hidden));
};

const $presets=document.getElementById("presets");
for(const [label,text] of PRESETS){
  const b=document.createElement("button");
  b.textContent=label;
  b.onclick=()=>{ $in.value=text; render(); };
  $presets.appendChild(b);
}

/* ---------- 読み上げ ----------
   題材が吹き替えなので、平板な合成音声で読まれて初めて体験が完成する。
   ブラウザ内蔵の Web Speech API を使うため、外部リクエストは増えない。

   声は女性のみ。男性音声を持たない端末が多く、ピッチを下げた代用は
   作り物とすぐ分かって笑いにならなかった。端末によって声が変わるより、
   どこで開いても同じ声で鳴るほうを取る。                              */

const FEMALE_RE = /kyoko|haruka|ayumi|sayaka|nanami|o-ren|flo|sandy|shelley|grandma|女/i;
const ICON_PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.2l8 4.8-8 4.8z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="1.2"/></svg>';

/* 読み上げ速度の振れ。18分34秒の吹き替え音声を文字起こしして、
   1区間あたりの文字数÷秒数を393件集め、中央値を1とした十分位。
   実測では速度は文の長さと相関しなかった（r=0.09）ので、長さから
   決めずに文ごとにこの分布から引く。極端値はタイムスタンプの誤差
   なので、人間の発話速度を超える域は落としてある。 */
const RATE_SPREAD = [0.82, 0.89, 0.95, 1.01, 1.05, 1.09, 1.19, 1.25, 1.39];

const $play = document.getElementById("play");
const TTS = typeof speechSynthesis !== "undefined";
let voice = null, speaking = false;

function loadVoices(){
  // 端末内の音声だけを使う。Chrome の「Google 日本語」などは合成をサーバーで行うため、
  // 使うと入力文が外部へ送られ、「文章はどこにも送信されません」が嘘になる。
  const ja = speechSynthesis.getVoices()
    .filter(v => /^ja/i.test(v.lang) && v.localService !== false);
  if(!ja.length) return;                              // 使える音声が無い環境では出さない
  voice = ja.find(v => FEMALE_RE.test(v.name)) || ja[0];
  document.getElementById("speakRow").hidden = false;
}

function stopSpeak(){
  speechSynthesis.cancel();
  speaking = false;
  $play.innerHTML = ICON_PLAY;
  $play.title = $play.ariaLabel = "読み上げる";
}

function speak(){
  const text = $out.textContent.trim();
  if(!text) return;
  stopSpeak();
  // Chrome は長い発話を途中で打ち切るので、文ごとに分けて積む
  const parts = text.match(/[^。！？!?\n]+[。！？!?]?/g) || [text];
  parts.map(t => t.trim()).filter(Boolean).forEach((t, i, a) => {
    const u = new SpeechSynthesisUtterance(t);
    u.voice = voice; u.lang = "ja-JP";
    u.rate = pickFlat(RATE_SPREAD);      // 文ごとに緩急がつく
    if(i === a.length - 1) u.onend = stopSpeak;
    speechSynthesis.speak(u);
  });
  speaking = true;
  $play.innerHTML = ICON_STOP;
  $play.title = $play.ariaLabel = "停止";
}

if(TTS){
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
  setTimeout(loadVoices, 1200);                       // 非同期で来ない環境の保険
  addEventListener("pagehide", () => speechSynthesis.cancel());
  stopSpeak();                                        // アイコンの初期化を兼ねる
  $play.onclick = () => speaking ? stopSpeak() : speak();
}

/* ---------- アクセス計測 ----------
   Cloudflare Web Analytics。Cookie を使わないので同意バナーは不要。
   計測されるのは閲覧数・流入元・時系列だけで、入力した文章は送信されない。
   トークンが空のあいだはスクリプトを読み込まない（＝外部リクエストは0のまま）。 */
const CF_TOKEN = "04f66ad1837a4b63af68beb6e835358f";   // Cloudflare Web Analytics（公開値）
if(CF_TOKEN){
  const b = document.createElement("script");
  b.defer = true;
  b.src = "https://static.cloudflareinsights.com/beacon.min.js";
  b.setAttribute("data-cf-beacon", JSON.stringify({token: CF_TOKEN}));
  document.head.appendChild(b);
}

// 着地した瞬間に変換結果が見えている状態にする。
// 空欄で始めると、最初の画面に面白いものが何も無い。
$in.value = PRESETS[0][1];
render();
</script>
</body>
</html>
