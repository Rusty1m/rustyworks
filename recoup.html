    4. 復旧するときは 1 で退避したファイルを戻す

  ファイル名が _ で始まるものは Jekyll が公開対象から外すので、
  このテンプレートと退避したページは rustyworks.jp には出ない。

  noindex を入れてある。メンテナンス文が検索結果の説明文として
  拾われると、復旧後もしばらくそのまま出てしまうため。
  公開ページに戻すときは noindex の行を必ず消すこと。
-->

</head>

        <button type="button" data-lang="ja" aria-pressed="true" style="font:inherit; background:none; border:0; cursor:pointer; color:#111214; padding:4px 6px; border-radius:4px;">JA</button>

    </div>

  <script>
  (function () {
    'use strict';
    // サイト共通の日英切り替え。選択は rw-lang に置くので、トップで EN に
    // した人はこのページも EN で開く。入れ替えるのは textContent なので、
    // 訳を付ける要素の中に別のタグを入れないこと。
    var KEY = 'rw-lang';
    var buttons = document.querySelectorAll('.lang button');
    var nodes = document.querySelectorAll('[data-ja][data-en]');

    function apply(lang) {
      document.documentElement.lang = lang;
      nodes.forEach(function (el) {
        var text = el.getAttribute('data-' + lang);
        if (text !== null) el.textContent = text;
      });
      buttons.forEach(function (b) {
        var on = b.dataset.lang === lang;
        b.setAttribute('aria-pressed', String(on));
        b.style.color = on ? '#111214' : '#8a8d93';
      });
      try { localStorage.setItem(KEY, lang); } catch (e) {}
    }
    buttons.forEach(function (b) {
      b.addEventListener('click', function () { apply(b.dataset.lang); });
    });
    var saved = null;
    // 言語は強い順に決める。1. URL の ?lang  2. 前回の選択  3. 既定は日本語。
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'en' || q === 'ja') {
        saved = q;
        localStorage.setItem(KEY, q);
      }
    } catch (e) {}
    if (!saved) { try { saved = localStorage.getItem(KEY); } catch (e) {} }
    if (!saved) saved = 'ja';
    if (saved === 'en') apply('en');
  })();
  </script>

</html>
